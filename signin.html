<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | CosmaTech Solutions</title>

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Sign in to your CosmaTech Solutions account to view your project updates, quote request history, and active web hosting services.">
  <meta name="keywords" content="sign in, login, CosmaTech Solutions, client portal">

  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body data-auth-page="true">

  <!-- Background Glow -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="auth-page-wrapper">
    <div class="auth-card">

      <!-- Logo Container -->
      <div class="auth-logo-container">
        <a href="index.html">
          <img src="images/cosmatech logo.png" alt="CosmaTech Solutions" class="logo-img" style="height: 48px;">
        </a>
      </div>

      <!-- Glassmorphic Card -->
      <div class="glass-card">

        <!-- Header -->
        <div class="auth-header">
          <h2>Welcome Back</h2>
          <p>Please enter your credentials to access your account</p>
        </div>

        <!-- Alert Container -->
        <div class="auth-alert auth-alert-danger" id="errorAlert">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorMessage">Invalid email or password.</span>
        </div>

        <!-- Form -->
        <form id="signInForm" novalidate style="margin-top: 16px;">

          <!-- Email Field -->
          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="password">Password *</label>
            <div class="password-input-wrapper">
              <input type="password" id="password" class="form-control" placeholder="••••••••" required>
              <button type="button" class="password-toggle-btn" id="passwordToggle"
                aria-label="Toggle password visibility">
                <i class="far fa-eye" id="toggleIcon"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="form-footer-row">
            <label class="remember-me-label" for="rememberMe">
              <input type="checkbox" id="rememberMe">
              <span>Remember Me</span>
            </label>
            <a href="#" class="forgot-password-link" id="forgotPasswordBtn">Forgot Password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; justify-content: center;">
            Sign In <i class="fas fa-sign-in-alt" style="margin-left: 8px;"></i>
          </button>

        </form>

        <!-- Redirect Link -->
        <div class="auth-footer-text">
          Don't have an account? <a href="signup.html">Create one here</a>
        </div>

      </div>
    </div>
  </div>

  <!-- Supabase & Sign In Logic -->
  <script src="js/supabase.js"></script>
  <script src="js/signin.js"></script>
</body>

</html>
