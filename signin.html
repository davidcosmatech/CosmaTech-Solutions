<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | CosmaTech Solutions</title>

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Sign in to your CosmaTech Solutions account to view your project updates, quote request history, and active web hosting services.">
  <meta name="keywords" content="sign in, login, CosmaTech Solutions, client portal">

  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=1.5">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js?v=1.0"></script>
<script src="js/supabase.js?v=1.2"></script>

<body data-auth-page="true">

  <!-- Background Glow -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="auth-page-wrapper">
    <div class="auth-card">

      <!-- Logo Container -->
      <div class="auth-logo-container">
        <a href="index.html">
          <img src="images/cosmatech logo.png" alt="CosmaTech Solutions" class="logo-img" style="height: 48px;">
        </a>
      </div>

      <!-- Glassmorphic Card -->
      <div class="glass-card">

        <!-- Header -->
        <div class="auth-header">
          <h2>Welcome Back</h2>
          <p>Please enter your credentials to access your account</p>
        </div>

        <!-- Alert Container -->
        <div class="auth-alert auth-alert-danger" id="errorAlert">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorMessage">Invalid email or password.</span>
        </div>
        <div class="auth-alert auth-alert-success" id="successAlert" style="display:none;">
          <i class="fas fa-check-circle"></i>
          <span id="successMessage"></span>
        </div>

        <!-- Form -->
        <form id="signInForm" novalidate style="margin-top: 16px;">

          <!-- Email Field -->
          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="password">Password *</label>
            <div class="password-input-wrapper">
              <input type="password" id="password" class="form-control" placeholder="••••••••" required>
              <button type="button" class="password-toggle-btn" id="passwordToggle"
                aria-label="Toggle password visibility">
                <i class="far fa-eye" id="toggleIcon"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="form-footer-row">
            <label class="remember-me-label" for="rememberMe">
              <input type="checkbox" id="rememberMe">
              <span>Remember Me</span>
            </label>
            <a href="#" class="forgot-password-link" id="forgotPasswordBtn">Forgot Password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; justify-content: center;">
            Sign In <i class="fas fa-sign-in-alt" style="margin-left: 8px;"></i>
          </button>

        </form>

        <form id="resetPasswordForm" novalidate style="display:none; margin-top: 16px;">
          <div class="form-group">
            <label for="newPassword">New password *</label>
            <input type="password" id="newPassword" class="form-control" minlength="8" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="confirmNewPassword">Confirm new password *</label>
            <input type="password" id="confirmNewPassword" class="form-control" minlength="8" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary" id="resetPasswordSubmit" style="width:100%; justify-content:center;">
            Update Password
          </button>
        </form>

        <!-- Redirect Link -->
        <div class="auth-footer-text">
          Don't have an account? <a href="signup.html">Create one here</a>
        </div>

      </div>
    </div>
  </div>

  <!-- Embedded Supabase Configuration & Sign In Logic -->
  <script>
    const supabaseClient = window.supabaseClient;

    document.addEventListener('DOMContentLoaded', async () => {
      // Check if user is already authenticated and redirect to dashboard
      const { data: { session } } = await supabaseClient.auth.getSession();
      const params = new URLSearchParams(window.location.search);
      const isPasswordRecovery = params.get('recovery') === '1';
      const signInForm = document.getElementById('signInForm');
      const resetPasswordForm = document.getElementById('resetPasswordForm');
      if (session && !isPasswordRecovery) {
        window.location.href = 'dashboard.html';
        return;
      }

      if (isPasswordRecovery) {
        signInForm.style.display = 'none';
        resetPasswordForm.style.display = 'block';
      }

      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const passwordToggle = document.getElementById('passwordToggle');
      const toggleIcon = document.getElementById('toggleIcon');
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      const successAlert = document.getElementById('successAlert');
      const successMessage = document.getElementById('successMessage');
      const resetPasswordSubmit = document.getElementById('resetPasswordSubmit');
      const submitBtn = document.getElementById('submitBtn');
      const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');

      if (params.get('confirmed') === '1') {
        successMessage.textContent = 'Your email is confirmed. You can now sign in.';
        successAlert.style.display = 'flex';
      } else if (params.get('check-email') === '1') {
        successMessage.textContent = 'Account created. Check your email for the confirmation link before signing in.';
        successAlert.style.display = 'flex';
      }

      resetPasswordForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const newPassword = document.getElementById('newPassword').value;
        const confirmNewPassword = document.getElementById('confirmNewPassword').value;
        if (newPassword.length < 8) {
          showError('Password must be at least 8 characters long.');
          return;
        }
        if (newPassword !== confirmNewPassword) {
          showError('Passwords do not match.');
          return;
        }

        resetPasswordSubmit.disabled = true;
        resetPasswordSubmit.classList.add('btn-loading');
        try {
          const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
          if (error) throw error;
          window.location.href = 'dashboard.html';
        } catch (err) {
          showError(err.message);
          resetPasswordSubmit.disabled = false;
          resetPasswordSubmit.classList.remove('btn-loading');
        }
      });

      // Toggle Password Visibility
      if (passwordToggle) {
        passwordToggle.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          toggleIcon.className = isPassword ? 'far fa-eye-slash' : 'far fa-eye';
        });
      }

      // Show error helper
      function showError(msg) {
        errorMessage.innerText = msg;
        errorAlert.style.display = 'flex';
      }

      // Hide error helper
      function hideError() {
        errorAlert.style.display = 'none';
      }

      // Email validation helper
      function isValidEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email.toLowerCase());
      }

      // Forgot Password trigger
      if (forgotPasswordBtn) {
        forgotPasswordBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          const email = emailInput.value.trim();
          if (!email) {
            showError('Please enter your email address to reset password.');
            emailInput.focus();
            return;
          }
          if (!isValidEmail(email)) {
            showError('Please enter a valid email address.');
            emailInput.focus();
            return;
          }

          try {
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
              redirectTo: window.getSupabaseRedirectUrl('signin.html?recovery=1'),
            });
            if (error) throw error;
            alert('Password recovery link has been sent to your email.');
          } catch (err) {
            showError(err.message);
          }
        });
      }

      // Handle Signin Submission
      if (signInForm) {
        signInForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          hideError();

          const email = emailInput.value.trim();
          const password = passwordInput.value;

          // Validation
          if (!email) {
            showError('Email Address is required.');
            emailInput.focus();
            return;
          }

          if (!isValidEmail(email)) {
            showError('Please enter a valid email address.');
            emailInput.focus();
            return;
          }

          if (!password) {
            showError('Password is required.');
            passwordInput.focus();
            return;
          }

          // Enable Loading State
          submitBtn.classList.add('btn-loading');
          submitBtn.disabled = true;

          try {
            const { error } = await supabaseClient.auth.signInWithPassword({
              email,
              password
            });

            if (error) {
              throw error;
            }

            // Redirect to dashboard on success
            window.location.href = 'dashboard.html';

          } catch (err) {
            submitBtn.classList.remove('btn-loading');
            submitBtn.disabled = false;
            showError(err.message);
          }
        });
      }

      // Interactive radial mouse glow inside glass-card
      const card = document.querySelector('.glass-card');
      if (card) {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          card.style.setProperty('--mouse-x', `${x}px`);
          card.style.setProperty('--mouse-y', `${y}px`);
        });
      }
    });
  </script>
</body>

</html>
