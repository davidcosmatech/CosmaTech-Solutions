<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | CosmaTech Solutions</title>

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Join CosmaTech Solutions. Register an account to submit quote requests, check repair status, and manage domain hosting services.">
  <meta name="keywords" content="sign up, register, CosmaTech Solutions, client registration">

  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body data-auth-page="true">

  <!-- Background Glow -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="auth-page-wrapper">
    <div class="auth-card" style="max-width: 550px;"> <!-- Slightly wider for registration grid -->

      <!-- Logo Container -->
      <div class="auth-logo-container">
        <a href="index.html">
          <img src="images/cosmatech logo.png" alt="CosmaTech Solutions" class="logo-img" style="height: 48px;">
        </a>
      </div>

      <!-- Glassmorphic Card -->
      <div class="glass-card" style="padding: 36px 40px;">

        <!-- Header -->
        <div class="auth-header">
          <h2>Create Account</h2>
          <p>Get started with your custom client portal</p>
        </div>

        <!-- Alert Container -->
        <div class="auth-alert auth-alert-danger" id="errorAlert">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorMessage">Invalid registration details.</span>
        </div>

        <!-- Form -->
        <form id="signUpForm" novalidate style="margin-top: 16px;">

          <!-- Name Grid -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label for="firstName">First Name *</label>
              <input type="text" id="firstName" class="form-control" placeholder="John" required>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name *</label>
              <input type="text" id="lastName" class="form-control" placeholder="Doe" required>
            </div>
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
          </div>

          <!-- Phone Number -->
          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" class="form-control" placeholder="07123 456789" required>
          </div>

          <!-- Password Grid -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;" class="password-fields-grid">
            <div class="form-group">
              <label for="password">Password *</label>
              <div class="password-input-wrapper">
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                <button type="button" class="password-toggle-btn" id="passwordToggle"
                  aria-label="Toggle password visibility">
                  <i class="far fa-eye" id="toggleIcon"></i>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label for="confirmPassword">Confirm Password *</label>
              <div class="password-input-wrapper">
                <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                <button type="button" class="password-toggle-btn" id="confirmPasswordToggle"
                  aria-label="Toggle password visibility">
                  <i class="far fa-eye" id="confirmToggleIcon"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Terms and Conditions Checkbox -->
          <div class="form-group" style="margin-top: 8px;">
            <label class="remember-me-label" for="terms"
              style="text-transform: none; font-size: 0.88rem; letter-spacing: 0;">
              <input type="checkbox" id="terms" required>
              <span>I agree to the <a href="#" style="color: var(--accent-light); font-weight: 500;"
                  id="termsLink">Terms & Conditions</a></span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" id="submitBtn"
            style="width: 100%; justify-content: center; margin-top: 8px;">
            Create Account <i class="fas fa-user-plus" style="margin-left: 8px;"></i>
          </button>

        </form>

        <!-- Redirect Link -->
        <div class="auth-footer-text">
          Already have an account? <a href="signin.html">Sign In instead</a>
        </div>

      </div>
    </div>
  </div>

  <!-- Supabase & Sign Up Logic -->
  <script src="js/supabase.js"></script>
  <script src="js/signup.js"></script>
</body>

</html>
